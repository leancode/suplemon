[metadata]
description-file = README.md

[flake8]
max-line-length = 120
inline-quotes = "
# Bare excepts are used deliberately throughout, mostly around curses calls
# and optional imports, where any failure should fall back instead of
# propagating. E722 postdates the flake8 this project pinned, so it was never
# enforced; ignoring it keeps test.sh usable with a current flake8 without
# rewriting 54 call sites.
extend-ignore = E722
