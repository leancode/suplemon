# Publishes to PyPI using Trusted Publishing (OIDC), so no API token is
# stored anywhere. Configure the trusted publisher on PyPI with:
#
#   PyPI project name:  suplemon-editor
#   Owner:              leancode
#   Repository name:    suplemon
#   Workflow name:      publish.yml
#   Environment name:   pypi
#
# Triggered by publishing a GitHub Release, not merely by pushing a tag, so
# that cutting a tag and publishing stay separate decisions.
name: publish

on:
  release:
    types: [published]
  # Lets you rehearse a build without publishing anything.
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refuse to build under someone else's name
        # "suplemon" on PyPI belongs to the original author. The same guard
        # lives in release.sh; this one covers the CI path.
        run: |
          name=$(python -c "import re; print(re.search(r'name=\"([^\"]+)\"', open('setup.py').read()).group(1))")
          echo "Distribution name: $name"
          if [ "$(echo "$name" | tr '[:upper:]' '[:lower:]')" = "suplemon" ]; then
            echo "::error::Refusing to build as '$name': that distribution belongs to the original author."
            exit 1
          fi

      - name: Check the tag matches the version
        # Only when triggered by a release, so workflow_dispatch stays usable.
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import re; print(re.search(r'^__version__ = \"([^\"]+)\"', open('suplemon/main.py').read(), re.M).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "setup.py version: $version, tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Only ever publishes from a real release, never from a manual run.
    if: github.event_name == 'release'
    environment: pypi
    permissions:
      # Required for Trusted Publishing. Nothing else needs write access,
      # which is why building happens in a separate job.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
